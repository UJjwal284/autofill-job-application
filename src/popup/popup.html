<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
body{width:320px;font:13px system-ui;margin:0;padding:14px}
h2{font-size:15px;margin:0 0 8px}
button{width:100%;padding:9px;margin-top:8px;border:0;border-radius:8px;cursor:pointer;font-weight:600}

#fill {
    background: #111;
    color: #fff
}

#fill:disabled {
    background: #999;
    cursor: default
}

#upload {
    background: #e8e8e8
}

#siteToggle {
    background: #e6efff
}

#siteToggle.off {
    background: #ffe1e1
}
#status{font-size:12px;color:#444;margin-top:8px;white-space:pre-wrap}

#site {
    font-size: 12px;
    color: #222;
    background: #f4f4f4;
    border-radius: 8px;
    padding: 6px 8px;
    margin-top: 8px;
    word-break: break-all
}
.hint{font-size:11px;color:#666;margin-top:8px}
a{font-size:12px}
</style></head>
<body>
<h2>Resume Autofill</h2>
<div id="site">This site: …</div>
<div id="status">Loading…</div>
<button id="upload">Upload / edit resume</button>
<button id="fill">Fill this form now</button>
<button id="siteToggle">Disable on this site</button>
<button id="forget" style="background:#f3d9d9">Forget learned fixes on this site</button>
<div class="hint">Upload on the settings page. The popup closes when the file picker opens, so uploading here does not work.</div>
<div><a href="#" id="openOptions">Settings</a></div>
<script src="../lib/profile.js"></script>
<script src="popup.js"></script>
</body></html>
